<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNC Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* noVNC canvas 容器 */
        #screen > div {
            width: 100% !important;
            height: 100% !important;
        }
        #screen canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }
        #clipboard-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
            display: flex;
            gap: 8px;
        }
        #clipboard-toolbar button,
        #clipboard-panel button {
            border: 1px solid #6b7280;
            background: rgba(17, 24, 39, 0.92);
            color: #fff;
            min-height: 36px;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }
        #clipboard-toolbar button:hover,
        #clipboard-panel button:hover {
            background: #1f2937;
        }
        #clipboard-toolbar button:disabled {
            color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.7;
        }
        #clipboard-panel {
            position: absolute;
            top: 56px;
            right: 10px;
            width: min(420px, calc(100vw - 20px));
            padding: 12px;
            background: rgba(17, 24, 39, 0.97);
            border: 1px solid #4b5563;
            color: #fff;
            z-index: 1002;
        }
        #clipboard-panel[hidden] {
            display: none;
        }
        #clipboard-panel textarea {
            display: block;
            width: 100%;
            min-height: 112px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #6b7280;
            background: #111827;
            color: #fff;
            font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            resize: vertical;
        }
        #clipboard-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .connecting {
            color: #fbbf24;
        }
        .connected {
            color: #10b981;
        }
        .disconnected {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="status" class="connecting">Connecting...</div>
    <div id="clipboard-toolbar">
        <button id="paste-clipboard" type="button" title="Send local clipboard to the virtual machine" disabled>Paste</button>
        <button id="copy-clipboard" type="button" title="Copy virtual machine clipboard to this device" hidden disabled>Copy</button>
    </div>
    <div id="clipboard-panel" hidden>
        <textarea id="clipboard-text" aria-label="Clipboard text" placeholder="Paste text here"></textarea>
        <div id="clipboard-actions">
            <button id="cancel-paste" type="button">Cancel</button>
            <button id="send-paste" type="button">Send</button>
        </div>
    </div>
    <div id="screen"></div>

    <script type="module">
        // 使用本地的 noVNC ES module
        import RFB from '/novnc/rfb.js';
        import KeyTable from '/novnc/input/keysym.js';
        import keysyms from '/novnc/input/keysymdef.js';

        const status = document.getElementById('status');
        const screen = document.getElementById('screen');
        const pasteButton = document.getElementById('paste-clipboard');
        const copyButton = document.getElementById('copy-clipboard');
        const clipboardPanel = document.getElementById('clipboard-panel');
        const clipboardText = document.getElementById('clipboard-text');
        const cancelPasteButton = document.getElementById('cancel-paste');
        const sendPasteButton = document.getElementById('send-paste');

        // 从 URL 参数获取 WebSocket地址
        const urlParams = new URLSearchParams(window.location.search);
        const wsUrl = urlParams.get('ws');

        if (!wsUrl) {
            status.textContent = 'Error: Missing WebSocket URL';
            status.className = 'disconnected';
            console.error('No WebSocket URL provided');
        } else {
            try {
                // 创建 RFB 连接
                const rfb = new RFB(screen, wsUrl, {
                    credentials: { password: '' }
                });

                // 设置缩放选项 - scaleViewport 会自动缩放以适应容器
                rfb.scaleViewport = true;
                rfb.resizeSession = false; // 不调整远程分辨率
                rfb.clipViewport = false;  // 不裁剪，完整显示
                rfb.showDotCursor = true;

                let isConnected = false;
                let guestClipboard = '';
                let clipboardPanelMode = 'send';
                let pasteKeyIntercepted = false;

                const focusConsole = () => {
                    rfb.focus({ preventScroll: true });
                };
                const sendGuestPasteShortcut = () => {
                    rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', true);
                    rfb.sendKey(keysyms.lookup('v'.codePointAt(0)), 'KeyV', true);
                    rfb.sendKey(keysyms.lookup('v'.codePointAt(0)), 'KeyV', false);
                    rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', false);
                };
                const syncClipboardAndPaste = async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        rfb.clipboardPasteFrom(text);
                        // ClientCutText reaches Windows asynchronously through qemu-vdagent.
                        await new Promise((resolve) => setTimeout(resolve, 200));
                    } catch (error) {
                        console.warn('Clipboard read failed:', error);
                    }

                    sendGuestPasteShortcut();
                    focusConsole();
                };
                const sendClipboard = (text) => {
                    if (!text) return;
                    if (!isConnected) {
                        status.textContent = 'Connect to the console before pasting';
                        status.className = 'disconnected';
                        status.style.display = 'block';
                        return;
                    }

                    clipboardPanel.hidden = true;
                    rfb.clipboardPasteFrom(text);

                    status.textContent = 'Clipboard sent to virtual machine';
                    status.className = 'connected';
                    status.style.display = 'block';
                    focusConsole();
                };

                const openClipboardPanel = (text = '', mode = 'send') => {
                    clipboardPanelMode = mode;
                    clipboardText.value = text;
                    clipboardText.readOnly = mode === 'receive';
                    sendPasteButton.hidden = mode === 'receive';
                    clipboardPanel.hidden = false;
                    clipboardText.focus();
                    if (mode === 'receive') clipboardText.select();
                };

                pasteButton.addEventListener('click', async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            sendClipboard(text);
                            return;
                        }
                    } catch (error) {
                        console.warn('Clipboard read failed:', error);
                    }
                    openClipboardPanel();
                });
                copyButton.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(guestClipboard);
                        status.textContent = 'Virtual machine clipboard copied';
                        status.className = 'connected';
                        status.style.display = 'block';
                    } catch (error) {
                        console.warn('Clipboard write failed:', error);
                        openClipboardPanel(guestClipboard, 'receive');
                    }
                });
                cancelPasteButton.addEventListener('click', () => {
                    clipboardPanel.hidden = true;
                    focusConsole();
                });
                sendPasteButton.addEventListener('click', () => {
                    sendClipboard(clipboardText.value);
                });
                clipboardText.addEventListener('keydown', (event) => {
                    if (clipboardPanelMode === 'send' && (event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                        event.preventDefault();
                        sendClipboard(clipboardText.value);
                    }
                });

                screen.addEventListener('keydown', (event) => {
                    if (!isConnected || !event.ctrlKey || event.altKey || event.metaKey || event.code !== 'KeyV') {
                        return;
                    }

                    event.preventDefault();
                    event.stopImmediatePropagation();
                    if (event.repeat) return;

                    pasteKeyIntercepted = true;
                    // Release the physical Ctrl while clipboard synchronization completes.
                    rfb.sendKey(KeyTable.XK_Control_L, 'ControlLeft', false);
                    void syncClipboardAndPaste();
                }, true);
                screen.addEventListener('keyup', (event) => {
                    if (!pasteKeyIntercepted || event.code !== 'KeyV') return;
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    pasteKeyIntercepted = false;
                }, true);

                rfb.addEventListener('clipboard', async (event) => {
                    guestClipboard = event.detail.text || '';
                    copyButton.hidden = !guestClipboard;
                    copyButton.disabled = !guestClipboard;
                    if (!guestClipboard) return;

                    try {
                        await navigator.clipboard.writeText(guestClipboard);
                        status.textContent = 'Clipboard received from virtual machine';
                    } catch (error) {
                        console.warn('Automatic clipboard write failed:', error);
                        status.textContent = 'Virtual machine clipboard ready to copy';
                    }
                    status.className = 'connected';
                    status.style.display = 'block';
                });

                // 更新缩放的函数
                const updateScale = () => {
                    if (rfb && rfb._connected) {
                        // 先关闭再开启，强制重新计算
                        rfb.scaleViewport = false;
                        requestAnimationFrame(() => {
                            rfb.scaleViewport = true;
                        });
                    }
                };

                // 连接事件
                rfb.addEventListener('connect', () => {
                    console.log('VNC connected');
                    isConnected = true;
                    pasteButton.disabled = false;
                    status.textContent = 'Connected';
                    status.className = 'connected';
                    status.style.display = 'block';
                    focusConsole();
                    // 连接后立即更新缩放
                    setTimeout(updateScale, 100);
                });

                // 断开连接事件
                rfb.addEventListener('disconnect', (e) => {
                    console.log('VNC disconnected:', e.detail);
                    isConnected = false;
                    pasteButton.disabled = true;
                    copyButton.hidden = true;
                    copyButton.disabled = true;
                    clipboardPanel.hidden = true;
                    status.textContent = 'Disconnected';
                    status.className = 'disconnected';
                    status.style.display = 'block';
                });

                // 安全失败事件
                rfb.addEventListener('securityfailure', (e) => {
                    console.error('VNC security failure:', e.detail);
                    status.textContent = 'Authentication failed';
                    status.className = 'disconnected';
                });

                // 窗口大小变化时更新缩放
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(updateScale, 100);
                });

            } catch (error) {
                console.error('Failed to initialize VNC:', error);
                status.textContent = 'Error: ' + error.message;
                status.className = 'disconnected';
            }
        }
    </script>
</body>
</html>
