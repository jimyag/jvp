<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNC Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* noVNC canvas 容器 */
        #screen > div {
            width: 100% !important;
            height: 100% !important;
        }
        #screen canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #screen.mouse-captured canvas {
            cursor: none;
        }
        #screen.mouse-captured {
            cursor: none;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
        }
        #clipboard-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1001;
        }
        #clipboard-toolbar button,
        #clipboard-panel button {
            border: 1px solid #6b7280;
            background: rgba(17, 24, 39, 0.92);
            color: #fff;
            min-height: 36px;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }
        #clipboard-toolbar button:hover,
        #clipboard-panel button:hover {
            background: #1f2937;
        }
        #clipboard-toolbar button:disabled {
            color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.7;
        }
        #clipboard-panel {
            position: absolute;
            top: 56px;
            right: 10px;
            width: min(420px, calc(100vw - 20px));
            padding: 12px;
            background: rgba(17, 24, 39, 0.97);
            border: 1px solid #4b5563;
            color: #fff;
            z-index: 1002;
        }
        #clipboard-panel[hidden] {
            display: none;
        }
        #clipboard-panel textarea {
            display: block;
            width: 100%;
            min-height: 112px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #6b7280;
            background: #111827;
            color: #fff;
            font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            resize: vertical;
        }
        #clipboard-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .connecting {
            color: #fbbf24;
        }
        .connected {
            color: #10b981;
        }
        .disconnected {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="status" class="connecting">Connecting...</div>
    <div id="clipboard-toolbar">
        <button id="paste-clipboard" type="button" title="Paste clipboard text into the console" disabled>Paste</button>
    </div>
    <div id="clipboard-panel" hidden>
        <textarea id="clipboard-text" aria-label="Text to paste into the console" placeholder="Paste text here"></textarea>
        <div id="clipboard-actions">
            <button id="cancel-paste" type="button">Cancel</button>
            <button id="send-paste" type="button">Send</button>
        </div>
    </div>
    <div id="screen"></div>

    <script type="module">
        // 使用本地的 noVNC ES module
        import RFB from '/novnc/rfb.js';
        import KeyTable from '/novnc/input/keysym.js';
        import keysyms from '/novnc/input/keysymdef.js';

        const status = document.getElementById('status');
        const screen = document.getElementById('screen');
        const pasteButton = document.getElementById('paste-clipboard');
        const clipboardPanel = document.getElementById('clipboard-panel');
        const clipboardText = document.getElementById('clipboard-text');
        const cancelPasteButton = document.getElementById('cancel-paste');
        const sendPasteButton = document.getElementById('send-paste');

        // 从 URL 参数获取 WebSocket地址
        const urlParams = new URLSearchParams(window.location.search);
        const wsUrl = urlParams.get('ws');

        if (!wsUrl) {
            status.textContent = 'Error: Missing WebSocket URL';
            status.className = 'disconnected';
            console.error('No WebSocket URL provided');
        } else {
            try {
                // 创建 RFB 连接
                const rfb = new RFB(screen, wsUrl, {
                    credentials: { password: '' }
                });

                // 设置缩放选项 - scaleViewport 会自动缩放以适应容器
                rfb.scaleViewport = true;
                rfb.resizeSession = false; // 不调整远程分辨率
                rfb.clipViewport = false;  // 不裁剪，完整显示
                rfb.showDotCursor = true;

                let capturedMouse = null;
                let ignoreInitialPointerMove = false;
                let isConnected = false;

                const getCanvas = () => rfb._canvas;
                const getDisplay = () => rfb._display;
                const isPointerLocked = () => document.pointerLockElement === screen;
                const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
                const focusConsole = () => {
                    rfb.focus({ preventScroll: true });
                };
                const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
                const shiftedKeys = {
                    '~': 'Backquote', '!': 'Digit1', '@': 'Digit2', '#': 'Digit3',
                    '$': 'Digit4', '%': 'Digit5', '^': 'Digit6', '&': 'Digit7',
                    '*': 'Digit8', '(': 'Digit9', ')': 'Digit0', '_': 'Minus',
                    '+': 'Equal', '{': 'BracketLeft', '}': 'BracketRight',
                    '|': 'Backslash', ':': 'Semicolon', '"': 'Quote',
                    '<': 'Comma', '>': 'Period', '?': 'Slash',
                };
                const plainKeys = {
                    '`': 'Backquote', '-': 'Minus', '=': 'Equal', '[': 'BracketLeft',
                    ']': 'BracketRight', '\\': 'Backslash', ';': 'Semicolon',
                    "'": 'Quote', ',': 'Comma', '.': 'Period', '/': 'Slash',
                    ' ': 'Space',
                };

                const keyStrokeForCharacter = (character) => {
                    if (/^[a-z]$/.test(character)) {
                        return { keysym: keysyms.lookup(character.codePointAt(0)), code: `Key${character.toUpperCase()}` };
                    }
                    if (/^[A-Z]$/.test(character)) {
                        return { keysym: keysyms.lookup(character.codePointAt(0)), code: `Key${character}`, shift: true };
                    }
                    if (/^[0-9]$/.test(character)) {
                        return { keysym: keysyms.lookup(character.codePointAt(0)), code: `Digit${character}` };
                    }
                    if (shiftedKeys[character]) {
                        return { keysym: keysyms.lookup(character.codePointAt(0)), code: shiftedKeys[character], shift: true };
                    }
                    if (plainKeys[character]) {
                        return { keysym: keysyms.lookup(character.codePointAt(0)), code: plainKeys[character] };
                    }
                    return { keysym: keysyms.lookup(character.codePointAt(0)) };
                };

                const sendTextAsKeys = async (text) => {
                    if (!text) return;
                    if (!isConnected) {
                        status.textContent = 'Connect to the console before pasting';
                        status.className = 'disconnected';
                        status.style.display = 'block';
                        return;
                    }

                    if (isPointerLocked()) {
                        document.exitPointerLock();
                    }
                    clipboardPanel.hidden = true;
                    focusConsole();

                    for (const character of text.replace(/\r\n/g, '\n')) {
                        let keyStroke;
                        if (character === '\n') {
                            keyStroke = { keysym: KeyTable.XK_Return, code: 'Enter' };
                        } else if (character === '\t') {
                            keyStroke = { keysym: KeyTable.XK_Tab, code: 'Tab' };
                        } else {
                            keyStroke = keyStrokeForCharacter(character);
                        }
                        if (keyStroke.keysym) {
                            if (keyStroke.shift) {
                                rfb.sendKey(KeyTable.XK_Shift_L, 'ShiftLeft', true);
                            }
                            rfb.sendKey(keyStroke.keysym, keyStroke.code);
                            if (keyStroke.shift) {
                                rfb.sendKey(KeyTable.XK_Shift_L, 'ShiftLeft', false);
                            }
                            await sleep(5);
                        }
                    }

                    status.textContent = 'Clipboard text sent';
                    status.className = 'connected';
                    status.style.display = 'block';
                };

                const openClipboardPanel = (text = '') => {
                    if (isPointerLocked()) {
                        document.exitPointerLock();
                    }
                    clipboardText.value = text;
                    clipboardPanel.hidden = false;
                    clipboardText.focus();
                };

                pasteButton.addEventListener('click', async () => {
                    try {
                        const text = await navigator.clipboard.readText();
                        if (text) {
                            await sendTextAsKeys(text);
                            return;
                        }
                    } catch (error) {
                        console.warn('Clipboard read failed:', error);
                    }
                    openClipboardPanel();
                });
                cancelPasteButton.addEventListener('click', () => {
                    clipboardPanel.hidden = true;
                    focusConsole();
                });
                sendPasteButton.addEventListener('click', async () => {
                    await sendTextAsKeys(clipboardText.value);
                });
                clipboardText.addEventListener('keydown', async (event) => {
                    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                        event.preventDefault();
                        await sendTextAsKeys(clipboardText.value);
                    }
                });

                const buttonMask = (buttons) => {
                    const buttonMaskMap = {
                        0: 1 << 0,
                        1: 1 << 2,
                        2: 1 << 1,
                        3: 1 << 7,
                        4: 1 << 8,
                    };
                    let mask = 0;
                    for (let i = 0; i < 5; i++) {
                        if (buttons & (1 << i)) {
                            mask |= buttonMaskMap[i];
                        }
                    }
                    return mask;
                };

                const sendPointer = () => {
                    if (!capturedMouse || !rfb._sock) return;
                    RFB.messages.pointerEvent(
                        rfb._sock,
                        Math.round(capturedMouse.x),
                        Math.round(capturedMouse.y),
                        capturedMouse.mask
                    );
                };

                const updateCapturedPositionFromEvent = (event) => {
                    const canvas = getCanvas();
                    const display = getDisplay();
                    if (!canvas || !display) return null;

                    const bounds = canvas.getBoundingClientRect();
                    const localX = clamp(event.clientX - bounds.left, 0, Math.max(bounds.width - 1, 0));
                    const localY = clamp(event.clientY - bounds.top, 0, Math.max(bounds.height - 1, 0));
                    const scaleX = display.width / Math.max(bounds.width, 1);
                    const scaleY = display.height / Math.max(bounds.height, 1);
                    capturedMouse = {
                        x: clamp(localX * scaleX, 0, Math.max(display.width - 1, 0)),
                        y: clamp(localY * scaleY, 0, Math.max(display.height - 1, 0)),
                        mask: buttonMask(event.buttons),
                    };
                    return capturedMouse;
                };

                const requestMouseCapture = (event) => {
                    if (isPointerLocked()) return;

                    event.preventDefault();
                    event.stopImmediatePropagation();
                    updateCapturedPositionFromEvent(event);
                    focusConsole();
                    const lockRequest = screen.requestPointerLock?.();
                    if (lockRequest?.catch) {
                        lockRequest.catch((error) => {
                            console.warn('Pointer lock request failed:', error);
                        });
                    }
                };

                const handlePointerLockChange = () => {
                    const locked = isPointerLocked();
                    screen.classList.toggle('mouse-captured', locked);
                    status.textContent = locked ? 'Mouse captured' : 'Click console to capture mouse';
                    status.className = 'connected';
                    status.style.display = 'block';
                    ignoreInitialPointerMove = locked;
                    if (locked) {
                        focusConsole();
                    }
                    if (!locked) {
                        capturedMouse = null;
                        ignoreInitialPointerMove = false;
                    }
                };

                const handleCapturedMouseMove = (event) => {
                    if (!isPointerLocked() || !capturedMouse) return;

                    const display = getDisplay();
                    if (!display) return;

                    event.preventDefault();
                    event.stopImmediatePropagation();

                    if (ignoreInitialPointerMove) {
                        ignoreInitialPointerMove = false;
                        if (Math.abs(event.movementX) > 100 || Math.abs(event.movementY) > 100) {
                            return;
                        }
                    }

                    const canvas = getCanvas();
                    const bounds = canvas?.getBoundingClientRect();
                    const scaleX = display.width / Math.max(bounds?.width || 1, 1);
                    const scaleY = display.height / Math.max(bounds?.height || 1, 1);
                    capturedMouse.x = clamp(
                        capturedMouse.x + event.movementX * scaleX,
                        0,
                        Math.max(display.width - 1, 0)
                    );
                    capturedMouse.y = clamp(
                        capturedMouse.y + event.movementY * scaleY,
                        0,
                        Math.max(display.height - 1, 0)
                    );
                    sendPointer();
                };

                const handleCapturedMouseButton = (event) => {
                    if (!isPointerLocked() || !capturedMouse) return;

                    event.preventDefault();
                    event.stopImmediatePropagation();
                    capturedMouse.mask = buttonMask(event.buttons);
                    sendPointer();
                };

                const handleCapturedWheel = (event) => {
                    if (!isPointerLocked() || !capturedMouse) return;
                    event.preventDefault();
                    event.stopImmediatePropagation();
                };

                const handlePointerLockError = () => {
                    status.textContent = 'Click inside the console to capture the mouse';
                    status.className = 'connected';
                    status.style.display = 'block';
                };

                const installMouseCapture = () => {
                    screen.addEventListener('mousedown', requestMouseCapture, true);
                    document.addEventListener('pointerlockchange', handlePointerLockChange);
                    document.addEventListener('pointerlockerror', handlePointerLockError);
                    document.addEventListener('mousemove', handleCapturedMouseMove, true);
                    document.addEventListener('mousedown', handleCapturedMouseButton, true);
                    document.addEventListener('mouseup', handleCapturedMouseButton, true);
                    document.addEventListener('wheel', handleCapturedWheel, true);
                };

                // 更新缩放的函数
                const updateScale = () => {
                    if (rfb && rfb._connected) {
                        // 先关闭再开启，强制重新计算
                        rfb.scaleViewport = false;
                        requestAnimationFrame(() => {
                            rfb.scaleViewport = true;
                        });
                    }
                };

                // 连接事件
                rfb.addEventListener('connect', () => {
                    console.log('VNC connected');
                    isConnected = true;
                    pasteButton.disabled = false;
                    status.textContent = 'Click console to capture mouse';
                    status.className = 'connected';
                    status.style.display = 'block';
                    installMouseCapture();
                    // 连接后立即更新缩放
                    setTimeout(updateScale, 100);
                });

                // 断开连接事件
                rfb.addEventListener('disconnect', (e) => {
                    console.log('VNC disconnected:', e.detail);
                    isConnected = false;
                    pasteButton.disabled = true;
                    clipboardPanel.hidden = true;
                    status.textContent = 'Disconnected';
                    status.className = 'disconnected';
                    status.style.display = 'block';
                });

                // 安全失败事件
                rfb.addEventListener('securityfailure', (e) => {
                    console.error('VNC security failure:', e.detail);
                    status.textContent = 'Authentication failed';
                    status.className = 'disconnected';
                });

                // 窗口大小变化时更新缩放
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(updateScale, 100);
                });

            } catch (error) {
                console.error('Failed to initialize VNC:', error);
                status.textContent = 'Error: ' + error.message;
                status.className = 'disconnected';
            }
        }
    </script>
</body>
</html>
